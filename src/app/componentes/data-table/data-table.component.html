<div class="overflow-x-auto">
  <table mat-table [dataSource]="data()" class="table">
    @for (col of columns(); track col.field) {
      <ng-container [matColumnDef]="col.field">
        <th mat-header-cell *matHeaderCellDef [style.width]="col.width" [class]="alignClass(col)">
          {{ col.header }}
        </th>
        <td mat-cell *matCellDef="let row" [class]="alignClass(col) + ' ' + cellClass(row, col)">
          @switch (col.type) {
            @case ('tag') {
              <span class="tag" [class]="tagClass(row, col)">{{ cellValue(row, col) }}</span>
            }
            @case ('custom') {
              <ng-container *ngTemplateOutlet="col.cellTemplate ?? null; context: { $implicit: row }"></ng-container>
            }
            @default {
              {{ cellValue(row, col) }}
            }
          }
        </td>
      </ng-container>
    }

    @if (actions().length) {
      <ng-container [matColumnDef]="actionsColumn">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row" class="flex gap-0.5 justify-end">
          @for (action of visibleActions(row); track action.label) {
            <button
              class="btn btn-icon btn-ghost"
              type="button"
              [disabled]="action.disabled?.(row) ?? false"
              [attr.aria-label]="action.label"
              (click)="action.onClick(row)"
              [innerHTML]="iconHtml(action.icon)"
            ></button>
          }
        </td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>
    <tr class="mat-mdc-row" *matNoDataRow>
      <td class="text-muted" [attr.colspan]="displayedColumns().length">{{ emptyMessage() }}</td>
    </tr>
  </table>
</div>
