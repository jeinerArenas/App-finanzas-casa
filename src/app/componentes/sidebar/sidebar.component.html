<div [class]="sidebarClass">
  <div class="pt-0 px-2 pb-4">
    <img
      src="/assets/img/logo-full.png"
      alt="FinanzFamily"
      class="w-full max-w-[160px] h-auto block"
    />
  </div>

  <a
    class="nav-link"
    routerLink="/dashboard"
    routerLinkActive="nav-link-active"
    (click)="onLinkClick()"
  >
    <svg width="16" height="16" viewBox="0 0 256 256">
      <rect x="40" y="40" width="70" height="70" rx="8" fill="currentColor"></rect>
      <rect x="146" y="40" width="70" height="70" rx="8" fill="currentColor"></rect>
      <rect x="40" y="146" width="70" height="70" rx="8" fill="currentColor"></rect>
      <rect x="146" y="146" width="70" height="70" rx="8" fill="currentColor"></rect>
    </svg>
    <span i18n="@@sidebar.resumen">Resumen</span>
  </a>

  <div>
    <button
      class="nav-link w-full"
      type="button"
      (click)="toggleMovimientos()"
      [attr.aria-expanded]="movimientosOpen()"
    >
      <span [innerHTML]="expenseIcon"></span>
      <span i18n="@@sidebar.movimientos">Movimientos</span>
      <svg
        class="ml-auto transition-transform duration-150"
        [class.rotate-90]="movimientosOpen()"
        width="12"
        height="12"
        viewBox="0 0 256 256"
        fill="none"
      >
        <path
          d="M96 48l80 80-80 80"
          stroke="currentColor"
          stroke-width="20"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></path>
      </svg>
    </button>

    @if (movimientosOpen()) {
      <div class="flex flex-col gap-1 pl-4 mt-1">
        <a
          class="nav-link"
          routerLink="/movimientos/ingresos"
          routerLinkActive="nav-link-active"
          (click)="onLinkClick()"
        >
          <span [innerHTML]="incomeIcon"></span>
          <span i18n="@@sidebar.ingresos">Ingresos</span>
        </a>
        <a
          class="nav-link"
          routerLink="/movimientos/gastos"
          routerLinkActive="nav-link-active"
          (click)="onLinkClick()"
        >
          <span [innerHTML]="expenseIcon"></span>
          <span i18n="@@sidebar.gastos">Gastos</span>
        </a>
      </div>
    }
  </div>

  <a
    class="nav-link"
    routerLink="/deudas"
    routerLinkActive="nav-link-active"
    (click)="onLinkClick()"
  >
    <span [innerHTML]="debtIcon"></span>
    <span i18n="@@sidebar.deudas">Deudas</span>
  </a>

  <a
    class="nav-link"
    routerLink="/categorias"
    routerLinkActive="nav-link-active"
    (click)="onLinkClick()"
  >
    <span [innerHTML]="categoryIcon"></span>
    <span i18n="@@sidebar.categorias">Categorías</span>
  </a>

  @if (isAdmin()) {
    <a
      class="nav-link"
      routerLink="/usuarios"
      routerLinkActive="nav-link-active"
      (click)="onLinkClick()"
    >
      <span [innerHTML]="userIcon"></span>
      <span i18n="@@sidebar.usuarios">Usuarios</span>
    </a>
    <a
      class="nav-link"
      routerLink="/actividad"
      routerLinkActive="nav-link-active"
      (click)="onLinkClick()"
    >
      <svg width="16" height="16" viewBox="0 0 256 256">
        <circle
          cx="128"
          cy="128"
          r="88"
          fill="none"
          stroke="currentColor"
          stroke-width="14"
        ></circle>
        <path
          d="M128 76v56l40 24"
          fill="none"
          stroke="currentColor"
          stroke-width="14"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></path>
      </svg>
      <span i18n="@@sidebar.actividad">Actividad</span>
    </a>
  }
</div>
