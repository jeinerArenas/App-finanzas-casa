<div [class]="sidebarClass">
  <div class="pt-0 px-2 pb-4">
    <img src="/assets/img/logo-full.png" alt="FinanzFamily" class="w-full max-w-[160px] h-auto block" />
  </div>

  <a
    class="nav-link"
    routerLink="/dashboard"
    routerLinkActive="nav-link-active"
    (click)="onLinkClick()"
  >
    <svg width="16" height="16" viewBox="0 0 256 256"><rect x="40" y="40" width="70" height="70" rx="8" fill="currentColor"></rect><rect x="146" y="40" width="70" height="70" rx="8" fill="currentColor"></rect><rect x="40" y="146" width="70" height="70" rx="8" fill="currentColor"></rect><rect x="146" y="146" width="70" height="70" rx="8" fill="currentColor"></rect></svg>
    Resumen
  </a>

  <a
    class="nav-link"
    routerLink="/movimientos"
    routerLinkActive="nav-link-active"
    (click)="onLinkClick()"
  >
    <svg width="16" height="16" viewBox="0 0 256 256"><line x1="40" y1="76" x2="216" y2="76" stroke="currentColor" stroke-width="18" stroke-linecap="round"></line><line x1="40" y1="128" x2="216" y2="128" stroke="currentColor" stroke-width="18" stroke-linecap="round"></line><line x1="40" y1="180" x2="216" y2="180" stroke="currentColor" stroke-width="18" stroke-linecap="round"></line></svg>
    Movimientos
  </a>

  <a
    class="nav-link"
    routerLink="/deudas"
    routerLinkActive="nav-link-active"
    (click)="onLinkClick()"
  >
    <svg width="16" height="16" viewBox="0 0 256 256"><rect x="32" y="72" width="192" height="128" rx="12" fill="none" stroke="currentColor" stroke-width="14"></rect><line x1="32" y1="108" x2="224" y2="108" stroke="currentColor" stroke-width="14"></line><line x1="64" y1="160" x2="120" y2="160" stroke="currentColor" stroke-width="14" stroke-linecap="round"></line></svg>
    Deudas
  </a>

  <a
    class="nav-link"
    routerLink="/categorias"
    routerLinkActive="nav-link-active"
    (click)="onLinkClick()"
  >
    <svg width="16" height="16" viewBox="0 0 256 256"><path d="M48 48h88l120 120-88 88L48 136Z" fill="none" stroke="currentColor" stroke-width="14" stroke-linejoin="round"></path><circle cx="90" cy="90" r="13" fill="currentColor"></circle></svg>
    Categorías
  </a>

  @if (isAdmin()) {
    <a
      class="nav-link"
      routerLink="/usuarios"
      routerLinkActive="nav-link-active"
      (click)="onLinkClick()"
    >
      <svg width="16" height="16" viewBox="0 0 256 256"><circle cx="96" cy="88" r="34" fill="none" stroke="currentColor" stroke-width="14"></circle><path d="M40 208c0-50 40-80 88-64" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round"></path><circle cx="178" cy="104" r="26" fill="none" stroke="currentColor" stroke-width="12"></circle><path d="M158 208c4-38 30-58 62-52" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"></path></svg>
      Usuarios
    </a>
    <a
      class="nav-link"
      routerLink="/actividad"
      routerLinkActive="nav-link-active"
      (click)="onLinkClick()"
    >
      <svg width="16" height="16" viewBox="0 0 256 256"><circle cx="128" cy="128" r="88" fill="none" stroke="currentColor" stroke-width="14"></circle><path d="M128 76v56l40 24" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      Actividad
    </a>
  }
</div>
