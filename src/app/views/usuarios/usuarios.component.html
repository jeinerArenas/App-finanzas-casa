<div class="card elev-sm">
  <div class="flex justify-between items-center gap-3 flex-wrap">
    <div class="card-title" i18n="@@usuarios.titulo">Usuarios</div>
    <button class="btn btn-primary" type="button" (click)="abrirCrear()" i18n="@@usuarios.agregar">
      Agregar usuario
    </button>
  </div>

  @if (error()) {
    <div class="error-text mt-2">{{ error() }}</div>
  }

  @if (cargando()) {
    <div class="text-muted mt-2" i18n="@@usuarios.cargando">Cargando usuarios…</div>
  } @else {
    <app-tabla-cbz-v2 [configuration]="tabla()" (events)="onTableEvent($event)" />
  }
</div>
