<div class="card elev-sm">
  <div class="flex justify-between items-start gap-3 flex-wrap">
    <div>
      <div class="card-title" i18n="@@categorias.titulo">Categorías y presupuestos</div>
      <div class="text-muted text-xs" i18n="@@categorias.ayuda">
        Presupuesto mensual y gasto real de {{ month.monthLabel() }} por categoría.
      </div>
    </div>
    <button
      class="btn btn-primary"
      type="button"
      (click)="abrirCrear()"
      i18n="@@categorias.agregar"
    >
      Agregar categoría
    </button>
  </div>

  @if (error()) {
    <div class="error-text mt-2">{{ error() }}</div>
  }

  <div class="mt-2.5">
    <app-tabla-cbz-v2 [configuration]="tabla()" (events)="onTableEvent($event)" />
  </div>

  <ng-template #overCell let-c>
    @if (c.over) {
      <span class="tag tag-accent" i18n="@@categorias.excedido">Excedido</span>
    }
  </ng-template>
</div>
